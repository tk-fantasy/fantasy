name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # 默认回归：单测 + mock 级 e2e（真实子进程的 slow 用例不在此跑）
  test:
    runs-on: ubuntu-latest
    # 挂死护栏：正常 ~4 分钟，超时强杀并保留日志（曾出现 ubuntu runner 上
    # 30+ 分钟不退出，需日志尾部定位卡点）。faulthandler_timeout：单个测试
    # 卡 4 分钟即自动 dump 全部线程栈到日志。
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -m "not slow" --tb=short -q -o faulthandler_timeout=240

  # slow E2E：拉起真实插件子进程走 RPC（~4 分钟），合入前必须全绿
  e2e-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run slow E2E tests
        run: pytest -m slow --tb=short -q

  # 前端（Vue3 + Vitest）
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 构建验证：此前只跑 vitest，构建损坏要等 Docker 构建才暴露。
      # Node 版本与 Dockerfile 的 node:22-alpine 保持一致。
      - name: Build (vite)
        run: npm run build

  # 代码质量门：lint（ruff）+ 安全扫描（bandit）为阻断项，依赖漏洞审计
  # （pip-audit）当前为非阻断——现有依赖链存在生态约束下的已知 CVE
  # （starlette 被 fastapi 0.115.x 钉在 <0.42、pillow 为传递依赖等），
  # 分批升级清零后翻回阻断。规则集见 ruff.toml，按"高信号低噪音"逐级收紧。
  lint-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install ruff bandit pip-audit

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Security scan (bandit)
        run: bandit -r app -q --skip B110,B112,B104

      - name: Dependency audit (pip-audit, non-blocking)
        continue-on-error: true
        run: pip-audit -r requirements.txt --no-deps
