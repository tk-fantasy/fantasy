# Aether 编排：MQTT + Home Assistant + Aether 应用
#
# 启动：docker compose up -d --build
# 停止：docker compose down
# 注：HA 配置里的 IP 由计划任务 \Aether\SyncHaIp 自动同步（每 10 分钟），无需手动改。
# 访问：http://localhost:8010
#
# 首次启动前：
#   1. cp config.example.json config.json，把 ha.token 改成 HA 长期令牌
#      （ha.url 无需改，下方 HA_URL 环境变量会用容器服务名覆盖）
#   2. cp .env.example .env，填入 LLM / STT 密钥
services:
  mqtt:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    ports:
      # 只绑宿主回环：HA/simulator 走 docker 内部网络访问 broker（服务名 mqtt），
      # 宿主端口仅供本机调试。默认弱口令 aether/aether 若绑 0.0.0.0 等于把
      # 设备控制面暴露给整个局域网。外部设备确需访问时自行改成 "1884:1884"
      # 并务必在 .env 里设置强 MQTT_PASSWORD。
      - "127.0.0.1:1884:1884"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/init.sh:/mosquitto/init.sh:ro
    # entrypoint：首次启动自动生成 passwd（passwd 被 .gitignore 排除，
    # 新用户 clone 后没有，mosquitto 会启动失败）
    entrypoint: ["/bin/sh", "/mosquitto/init.sh"]
    # 凭证从宿主 .env 注入（未配置时默认 aether/aether，见 init.sh）
    environment:
      MQTT_USER: ${MQTT_USER:-aether}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-aether}
    healthcheck:
      # QoS1 发布：收到 broker PUBACK 才算健康（真探活）。
      # 旧写法订阅无消息 topic 再 `|| exit 0` 兜底，恒返回 0，形同虚设。
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1884 -u $${MQTT_USER} -P $${MQTT_PASSWORD} -t '__healthcheck__' -m ok -q 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  homeassistant:
    container_name: aether-ha
    # 国内拉 ghcr.io 经常超时，改用 Docker Hub 镜像（homeassistant/home-assistant 是官方同步发布）
    image: homeassistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
    environment:
      TZ: Asia/Shanghai
    depends_on:
      mqtt:
        condition: service_healthy
    restart: unless-stopped

  aether:
    container_name: aether
    build: .
    # 镜像固定 latest：离线升级（运维页上传 / upgrade.sh）load 后统一 tag 到 latest，
    # 开发流 docker compose build 也天然打到 latest，两条路不打架。
    # 当前实际版本看 version.json / /api/ops/version。
    image: aether-app:latest
    ports:
      - "8010:8010"   # 主服务（API + WebSocket + 前端 SPA）
      - "8011:8011"   # 冷启动进度端口（加载页轮询）
    env_file: .env
    environment:
      # 容器内通过 compose 服务名访问 HA，覆盖 config.json 里的 localhost
      HA_URL: http://homeassistant:8123
      TZ: Asia/Shanghai
    volumes:
      # 配置文件（首次从 config.example.json 复制，运行时写入持久化到宿主）
      - ./config.json:/aether/config.json
      # Docker socket：供「高级配置 → 虚拟设备」开关停止/启动 simulator + mosquitto 容器。
      # 注意：这赋予 aether 容器宿主 Docker 管理权限，仅限本机可信部署；无需该功能可删掉此行。
      - /var/run/docker.sock:/var/run/docker.sock
      # 运行时数据：SQLite 库、JWT 密钥、emoji 索引
      # 用 named volume 而非 bind mount —— Windows bind mount 不支持 SQLite WAL 共享内存
      - aether-data:/aether/app/data
      # 日志
      - ./logs:/aether/logs
      # 备份/升级历史（运维页「备份」「升级」写入，持久化到宿主）
      - ./backups:/aether/backups
      # 语义图构建产物
      - ./app/sg/output:/aether/app/sg/output
    depends_on:
      mqtt:
        condition: service_healthy
      homeassistant:
        condition: service_started
    restart: unless-stopped

  # 纯内网本地模型（可选，默认不启动）：
  #   docker compose --profile local-llm up -d ollama        # 启动
  #   docker exec aether-ollama ollama pull qwen3:8b          # 拉模型（按需选）
  # 之后在「API Keys」把各角色 base_url 填 http://ollama:11434/v1（OpenAI 兼容），
  # 高级设置 → 数据出网模式 切「纯内网」，即完成零出网配置。
  ollama:
    container_name: aether-ollama
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  simulator:
    # 虚拟设备模拟器：通过 MQTT 往 HA 报告灯/空调/窗帘等设备状态。
    # 默认不启动（生产环境不该有假设备）：首次启用跑
    #   docker compose --profile simulator up -d simulator
    # 之后「高级配置 → 虚拟设备」开关即可随时启停（docker start/stop）。
    container_name: aether-simulator
    image: python:3.11-slim
    profiles: ["simulator"]
    working_dir: /sim
    # 钉死版本：ha_simulator 用 paho-mqtt 2.x API（CallbackAPIVersion.VERSION2）
    command: ["sh", "-c", "pip install --no-cache-dir -q -i https://pypi.tuna.tsinghua.edu.cn/simple paho-mqtt==2.1.0 && python ha_simulator.py --docker"]
    environment:
      MQTT_USER: ${MQTT_USER:-aether}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-aether}
    volumes:
      - ./ha_config/ha_simulator.py:/sim/ha_simulator.py:ro
    depends_on:
      mqtt:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aether-data:
  ollama:
