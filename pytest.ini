[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not slow"
markers =
    slow: slow tests (spawn real plugin subprocesses / RPC e2e, ~3min). Run explicitly with: pytest -m slow
    migration: tests that exercise the legacy→cameras migration
